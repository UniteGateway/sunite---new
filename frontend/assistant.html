<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUNITE | AI engineering assistant</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#15243d;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}
header{background:#102d4e;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
header a{color:#9fcbff;font-size:13px;margin-left:12px}header img{height:34px;background:#fff;border-radius:6px;padding:2px 6px}
main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e1e8f0;border-radius:14px;padding:14px;margin-bottom:12px}
select,textarea{width:100%;padding:9px;border:1px solid #ced8e6;border-radius:8px;font:inherit;font-size:14px}textarea{height:80px}
button{border:0;background:#ff7518;color:#fff;padding:9px 13px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}button.secondary{background:#eaf0f8;color:#17324c}
.msg{white-space:pre-wrap;font-size:14px;line-height:1.5}.tools{font-size:12px;color:#667992;margin-top:8px}.warn{background:#fff3d6;color:#7a4b00;padding:8px 10px;border-radius:8px;font-size:13px;margin-top:8px}
.prop{border:1px solid #ffd2b0;background:#fff8f2;border-radius:10px;padding:10px;margin-top:8px;font-size:13px}table{border-collapse:collapse;width:100%;font-size:12.5px}td,th{padding:5px;border-bottom:1px solid #eee;text-align:left}
.chips button{background:#eaf0f8;color:#17324c;font-weight:600;font-size:12px;margin:3px 3px 0 0}
</style></head><body>
<header><div style="display:flex;align-items:center;gap:10px"><img src="/static/assets/sunite-logo-small.png" alt="SUNITE"><strong>AI engineering assistant</strong></div><div><a href="/">Designer</a><a href="/operations">Operations</a></div></header>
<main><div class="card"><select id="proj"><option value="">(no project)</option></select>
<div class="chips" id="chips"></div><textarea id="q" placeholder="Ask about your project, e.g. Which modules are most shaded and why?"></textarea>
<div style="margin-top:8px"><button onclick="ask()">Ask</button></div>
<p class="tools">Answers come only from engine results on your project. Figures not found in project data are flagged. Suggested design changes need your approval before they are saved.</p></div>
<div id="log"></div></main>
<script>
const $=id=>document.getElementById(id),tok=sessionStorage.getItem('suniteToken')||'';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o={}){o.headers={'Content-Type':'application/json',...(tok?{'Authorization':'Bearer '+tok}:{})};const r=await fetch(p,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Error '+r.status);return d}
['Summarise this design','Which modules are most shaded?','What information is missing before we quote?','Would a 12° tilt be better?'].forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{$('q').value=t;ask()};$('chips').appendChild(b)});
function card(html){const d=document.createElement('div');d.className='card';d.innerHTML=html;$('log').prepend(d);return d}
function kpiTable(p){const k=Object.keys(p.kpi_before);return `<table><tr><th>KPI</th><th>Now</th><th>Proposed</th></tr>${k.map(x=>`<tr><td>${esc(x)}</td><td>${esc(p.kpi_before[x])}</td><td><b>${esc(p.kpi_after[x])}</b></td></tr>`).join('')}</table>`}
async function ask(){const q=$('q').value.trim();if(!q)return;const c=card(`<b>${esc(q)}</b><p class="msg">Thinking…</p>`);
 try{const d=await api('/api/ai/ask',{method:'POST',body:JSON.stringify({question:q,project_id:$('proj').value||null})});
  if(d.status!=='ok'){c.querySelector('.msg').textContent=d.message;return}
  c.innerHTML=`<b>${esc(q)}</b><p class="msg">${esc(d.answer)}</p>${d.notice?`<div class="warn">${esc(d.notice)} (${esc(d.grounding.ungrounded_numbers.join(', '))})</div>`:''}
  ${d.proposals.map(p=>`<div class="prop"><b>Proposed change</b> ${esc(JSON.stringify(p.changes))}${kpiTable(p)}<div style="margin-top:6px"><button onclick="decide('${p.proposal_id}',true,this)">Approve &amp; save revision</button> <button class="secondary" onclick="decide('${p.proposal_id}',false,this)">Reject</button></div></div>`).join('')}
  <div class="tools">Tools used: ${d.tool_calls.map(t=>esc(t.name)+(t.ok?'':' (failed)')).join(', ')||'none'}</div>`}catch(e){c.querySelector('.msg').textContent=e.message}}
async function decide(id,ok,btn){try{const r=await api(`/api/ai/proposals/${id}/decide`,{method:'POST',body:JSON.stringify({approve:ok})});btn.parentElement.innerHTML=`<b>${esc(r.status)}</b>`}catch(e){alert(e.message)}}
api('/api/projects').then(l=>{$('proj').innerHTML+=l.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} (rev ${p.revision})</option>`).join('')}).catch(()=>{});
</script></body></html>
