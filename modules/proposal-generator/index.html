<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUNITE Proposal Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* VOICE: a working tool for Unite Solar sales staff and franchise partners — calm, exact, fast.
   IDEA: a proposal binder that fills itself as you go; the live summary is the cover sheet.
   PICTURE: the step form on the left, a live "quote card" with the price and the energy split on the right.
   COLOUR and TYPE: Unite orange #f26b1d on white and ink #1c1c1c; Inter throughout.
   LAYOUT: top bar, step rail, form column, sticky quote card; stacks to one column on phones. */
:root{color-scheme:light dark;--bg:light-dark(#f6f6f4,#121212);--card:light-dark(#fff,#1c1c1c);--ink:light-dark(#1c1c1c,#ececec);--mut:light-dark(#6b6b6b,#a3a3a3);--line:light-dark(#e3e3e3,#333);--or:#f26b1d;--orl:light-dark(#fdf3ec,#3a2214);--blue:#2b6cb0}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
header{background:#1c1c1c;color:#fff;padding:14px max(4vw,16px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;letter-spacing:-.3px}.logo b{color:var(--or)}
header .sub{color:#bdbdbd;font-size:13px}
header .sp{flex:1}
.wrap{max-width:1240px;margin:0 auto;padding:20px max(3vw,14px) 60px;display:grid;grid-template-columns:200px minmax(0,1fr) 330px;gap:20px;align-items:start}
nav.steps{position:sticky;top:16px;display:flex;flex-direction:column;gap:4px}
nav.steps button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;min-height:44px;color:var(--mut);font-weight:500}
nav.steps button .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:13px;flex:none}
nav.steps button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
nav.steps button.on .n{background:var(--or);border-color:var(--or);color:#fff}
nav.steps button.done .n{border-color:var(--or);color:var(--or)}
nav.steps button:focus-visible{outline:2px solid var(--or)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,2.5vw,28px)}
h1{font-size:26px;line-height:1.1;margin:0 0 4px;text-wrap:balance}
h2{font-size:17px;margin:22px 0 10px}
p.lead{color:var(--mut);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut);font-weight:500}
input,select,textarea{font:16px Inter,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;min-height:44px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--or);border-color:transparent}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;font-weight:600;background:var(--or);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mut);cursor:pointer;display:block}
.drop.over{border-color:var(--or);background:var(--orl)}
.drop b{color:var(--ink)}
.files{display:grid;gap:10px;margin-top:14px}
.file{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.file img{width:72px;height:72px;object-fit:cover;border-radius:8px;background:#ddd}
.file .t{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.file .s{font-size:13px;color:var(--mut)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--orl);color:var(--or);font-weight:600}
.tag.ok{background:light-dark(#e8f5ec,#16301f);color:light-dark(#2f855a,#7fd4a0)}
.tag.err{background:light-dark(#fdecec,#3a1616);color:#d64545}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:12.5px;border-bottom:1.5px solid var(--ink);padding:6px 6px}
td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:middle}
td input,td select{min-height:38px;padding:6px 8px;font-size:15px}
.r{text-align:right}.nw{white-space:nowrap}
.note{background:var(--orl);border-left:3px solid var(--or);padding:10px 14px;border-radius:0 9px 9px 0;font-size:14px;margin-top:14px}
aside.quote{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
.qc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.qc .big{font-size:clamp(26px,3vw,32px);font-weight:700;letter-spacing:-.5px;line-height:1.1}
.qc .lbl{font-size:12.5px;color:var(--mut)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}.kv span{color:var(--mut)}.kv b{font-weight:600;text-align:right}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:10px 0 6px;background:var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--mut)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:0 14px;min-height:42px;display:flex;align-items:center;font-weight:500;font-size:14px}
.seg button.on{background:var(--or);color:#fff}
.hint{font-size:12.5px;color:var(--mut);margin-top:4px}
.nav{display:flex;justify-content:space-between;margin-top:24px;gap:10px;flex-wrap:wrap}
.docwrap{background:light-dark(#e9e9e6,#0c0c0c);border-radius:12px;padding:16px;margin-top:14px;overflow:auto;max-height:78vh}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:96px;height:64px;object-fit:cover;border-radius:6px}
@media(max-width:1060px){.wrap{grid-template-columns:minmax(0,1fr) 300px}nav.steps{grid-column:1/-1;position:static;flex-direction:row;overflow-x:auto}nav.steps button{flex:none}}
@media(max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}aside.quote{position:static}nav.steps button .x{display:none}}
@media(prefers-reduced-motion:no-preference){.panel{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<header><div class="logo">S<b>U</b>NITE</div><div class="sub">Proposal Generator · Uniting the Solar Ecosystem</div><div class="sp"></div>
<button class="btn ghost" id="reset" style="color:#fff;border-color:#555">New proposal</button></header>
<div class="wrap">
<nav class="steps" id="steps"></nav>
<main id="main"></main>
<aside class="quote" id="quote"></aside>
</div>
<script>
{
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => { n = Math.round(+n || 0); const neg = n < 0; let s = String(Math.abs(n)); if (s.length > 3) { let h = s.slice(0, -3), t = s.slice(-3), p = []; while (h.length > 2) { p.unshift(h.slice(-2)); h = h.slice(0, -2); } if (h) p.unshift(h); s = p.join(',') + ',' + t; } return (neg ? '-' : '') + s; };
const R = n => '₹' + inr(n);
const cr = n => '₹' + (n / 1e7).toFixed(2) + ' cr';
const num = v => { const x = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(x) ? 0 : x; };
const today = () => new Date().toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});

const STEPS = ['Client', 'Power bills', 'Site & photos', 'System & budget', 'Proposal'];
const GEN = [608.9,636.3,764.1,774.2,800,600.8,537.3,525.3,554.6,597,566.2,561.2], GSUM = GEN.reduce((a,b)=>a+b,0);
const DAYS = [31,28,31,30,31,30,31,31,30,31,30,31], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const blank = () => ({
  step: 0,
  client: {name:'', addr:'', discom:'TGSPDCL', category:'HT', cmd:'', trafo:'', quote:'US/COM/' + new Date().toISOString().slice(2,4) + String(new Date().getMonth()+1).padStart(2,'0') + '/001', date: today(), valid: 15, sponsor:''},
  bills: [], monthlyUnits: 0, site: {loc:'', plots: []},
  sys: {mode:'budget', budget:210000000, rate:39600, approvals:300000, nm:500, btm:1800, bess:5, bessCost:60000000, go:0, oaManual:1000},
  asm: {tariff:8.8, esc:3, sale:3.07, day:42, yield:1505, deg:0.5, fade:2, rte:88},
  pay: [10,50,20,10,10], exec:'4–5 months from advance, subject to approvals'
});
let S = blank();
try { const s = JSON.parse(localStorage.getItem('sunite-pg') || 'null'); if (s && s.client) S = Object.assign(blank(), s); } catch (e) {}
const save = () => { try { const c = JSON.parse(JSON.stringify(S)); c.bills = c.bills.map(b => ({...b, thumb:null})); c.site.plots = c.site.plots.map(p => ({...p, url:null})); localStorage.setItem('sunite-pg', JSON.stringify(c)); } catch (e) {} };

let sample = null, downloads = null;
const cu = n => (window.claude && window.claude.use) ? window.claude.use(n) : Promise.resolve(null);
cu('sample').then(s => { sample = s; render(); }).catch(()=>{});
cu('downloads').then(d => { downloads = d; render(); }).catch(()=>{});

/* ---------- images ---------- */
function toImage(file, max = 1600) {
  return new Promise((res, rej) => {
    const go = src => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); c.toBlob(b => res({blob:b, url:c.toDataURL('image/jpeg', .82)}), 'image/jpeg', .85); }; im.onerror = rej; im.src = src; };
    if (file.type === 'application/pdf') {
      file.arrayBuffer().then(buf => pdfjsLib.getDocument({data: buf}).promise).then(pdf => pdf.getPage(1)).then(pg => {
        const vp = pg.getViewport({scale: 2}); const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
        return pg.render({canvasContext: c.getContext('2d'), viewport: vp}).promise.then(() => go(c.toDataURL('image/png')));
      }).catch(rej);
    } else { const r = new FileReader(); r.onload = () => go(r.result); r.onerror = rej; r.readAsDataURL(file); }
  });
}
async function askJSON(prompt, blob) {
  const lim = await sample.limits().catch(() => ({}));
  const opts = {modelTier:'default'}; if (lim.images && blob) opts.images = [blob];
  const r = await sample(prompt, opts);
  const m = r.text.match(/\{[\s\S]*\}/); if (!m) throw new Error('No data found');
  return JSON.parse(m[0]);
}

/* ---------- bills ---------- */
const BILL_PROMPT = `You are reading an Indian electricity bill (e.g. TGSPDCL, TGNPDCL, APSPDCL, BESCOM). Return ONLY a JSON object:
{"consumer_name":string|null,"service_number":string|null,"discom":string|null,"category":string|null,"contract_demand_kw":number|null,"billing_month":string|null,"units_kwh":number|null,"bill_amount_inr":number|null,"energy_charges_inr":number|null,"address":string|null,"history":[{"month":string,"units_kwh":number}]}
Use null when a value is not visible. units_kwh is the energy consumed in this billing month (kWh or kVAh). Convert kVA contract demand to kW at 0.9 power factor. history lists any past-month consumption printed on the bill.`;
async function readBill(b) {
  b.status = 'reading'; render();
  try {
    const d = await askJSON(BILL_PROMPT, b.blob); b.data = d; b.status = 'ok';
    const c = S.client;
    if (!c.name && d.consumer_name) c.name = d.consumer_name;
    if (!c.addr && d.address) c.addr = d.address;
    if (d.discom) c.discom = d.discom;
    if (d.category) c.category = d.category;
    if (!c.cmd && d.contract_demand_kw) c.cmd = d.contract_demand_kw;
    summariseBills();
  } catch (e) { b.status = 'err'; b.err = e.code === 'not_granted' ? 'Claude access was not granted' : 'Could not read this bill — enter the figures below'; }
  save(); render();
}
function summariseBills() {
  const ok = S.bills.filter(b => b.data);
  const months = {};
  ok.forEach(b => { (b.data.history || []).forEach(h => { if (h.units_kwh) months[h.month] = h.units_kwh; }); if (b.data.units_kwh) months[b.data.billing_month || b.name] = b.data.units_kwh; });
  const v = Object.values(months).filter(x => x > 0);
  if (v.length) S.monthlyUnits = Math.round(v.reduce((a,b)=>a+b,0) / v.length);
  const t = ok.filter(b => b.data.bill_amount_inr && b.data.units_kwh).map(b => b.data.bill_amount_inr / b.data.units_kwh);
  if (t.length) S.asm.tariff = +(t.reduce((a,b)=>a+b,0) / t.length).toFixed(2);
}

/* ---------- site ---------- */
const SITE_PROMPT = `This image is a satellite view, site photo or rooftop photo of a proposed solar plant location in India. Return ONLY a JSON object:
{"site_type":"ground"|"rooftop"|"unknown","area_value":number|null,"area_unit":"acres"|"m2"|"sqft"|null,"capacity_label_kwp":number|null,"perimeter_m":number|null,"shading":string|null,"notes":string}
Read area and perimeter from any on-screen measuring tool if shown. capacity_label_kwp: any capacity written on the image (2.5MWp = 2500). shading: nearby trees, buildings or structures that may shade panels, and on which side. notes: at most two short sentences on usability (clearing needed, roof condition, access).`;
const toM2 = (v, u) => u === 'acres' ? v*4046.86 : u === 'sqft' ? v*0.092903 : v;
function suggestKwp(p) { if (p.label) return p.label; const m2 = toM2(num(p.area), p.unit); return p.type === 'rooftop' ? Math.round(m2/0.092903/100) : Math.round(m2/8.4); }
async function readSite(p) {
  p.status = 'reading'; render();
  try {
    const d = await askJSON(SITE_PROMPT, p.blob);
    if (d.site_type && d.site_type !== 'unknown') p.type = d.site_type;
    if (d.area_value) { p.area = d.area_value; p.unit = d.area_unit || 'm2'; }
    if (d.capacity_label_kwp) p.label = d.capacity_label_kwp;
    p.notes = [d.notes, d.shading ? 'Shading: ' + d.shading : ''].filter(Boolean).join(' ');
    p.kwp = suggestKwp(p); p.status = 'ok';
  } catch (e) { p.status = 'err'; }
  save(); render();
}
function mapLink(loc) {
  const m = loc.match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  return m ? `https://www.google.com/maps?q=${m[1]},${m[2]}` : loc ? `https://www.google.com/maps/search/${encodeURIComponent(loc)}` : '';
}

/* ---------- model ---------- */
function solveTaxable(inc) { let T = Math.round(inc/1.089); for (let d = -6; d <= 6; d++) { const t = T + d; if (t + Math.round(t*.035) + Math.round(t*.054) === inc) return t; } return T; }
function calc() {
  const s = S.sys, a = S.asm;
  const bessInc = s.bess > 0 ? +s.bessCost : 0, go = +s.go || 0;
  let solarKwp, T, plant;
  if (s.mode === 'budget') {
    T = solveTaxable(s.budget - bessInc - go); plant = T - s.approvals; solarKwp = plant / s.rate;
  } else {
    solarKwp = +s.nm + +s.btm + +s.oaManual; plant = Math.round(solarKwp * s.rate); T = plant + +s.approvals;
  }
  const oa = Math.max(0, solarKwp - s.nm - s.btm);
  const g5 = Math.round(T*.035); let g18 = Math.round(T*.054);
  const bB = Math.round(bessInc/1.18), bG = bessInc - bB;
  if (s.mode === 'budget') g18 += s.budget - (T + g5 + g18 + bessInc + go);
  const total = T + g5 + g18 + bessInc + go;
  const templeKwp = +s.nm + +s.btm, cons = S.monthlyUnits || 0, buse = s.bess*900, rte = a.rte/100;
  const yrs = [], months = [];
  for (let i = 0; i < 25; i++) {
    const sd = (1 - a.deg/100)**i, bf = (1 - a.fade/100)**i; let off = 0, oaU = 0, gen = 0;
    GEN.forEach((g, m) => {
      const y = g/GSUM*a.yield, G = templeKwp*y*sd, day = cons*a.day/100, night = cons - day;
      const direct = Math.min(G, day), sur = G - direct, bin = Math.min(sur, buse*bf*DAYS[m]), bout = Math.min(rte*bin, night), exp = sur - bin;
      const o = oa*y*sd; off += direct + bout + exp; oaU += o; gen += G + o;
      if (i === 0) months.push({direct, bess:bout, exp, grid: Math.max(0, cons - direct - bout - exp), oa:o, G});
    });
    const tv = off*a.tariff*(1 + a.esc/100)**i, sv = oaU*a.sale;
    yrs.push({off, oaU, gen, tv, sv, b: tv + sv});
  }
  let c = 0, pb = null; const cum = yrs.map((y, i) => { const p = c; c += y.b; if (pb === null && c >= total) pb = i + (total - p)/y.b; return c; });
  return {solarKwp, oa, plant, T, g5, g18, bB, bG, bessInc, go, total, templeKwp, yrs, months, cum, pb, offPct: cons ? yrs[0].off/(cons*12)*100 : 0, perKwp: plant/solarKwp, landKwp: S.site.plots.reduce((x,p)=>x+(+p.kwp||0),0)};
}

/* ---------- UI ---------- */
const field = (lbl, path, type='text', extra='') => { const v = path.split('.').reduce((o,k)=>o[k], S); return `<label>${lbl}<input type="${type}" data-p="${path}" value="${esc(v)}" ${extra}></label>`; };
function stepClient() {
  return `<h1>Client details</h1><p class="lead">Who the proposal is for. Uploading bills in the next step fills most of this in.</p>
  <div class="grid">${field('Client / organisation name','client.name')}${field('Site address','client.addr')}${field('DISCOM','client.discom')}${field('Tariff category','client.category')}
  ${field('Contract load (kW)','client.cmd','number')}${field('Existing transformer (kVA)','client.trafo','number')}${field('Sponsor / donor (optional)','client.sponsor')}
  ${field('Quote number','client.quote')}${field('Quote date','client.date')}${field('Valid for (days)','client.valid','number')}</div>`;
}
function stepBills() {
  const list = S.bills.map((b, i) => `<div class="file">${b.thumb ? `<img src="${b.thumb}" alt="">` : '<img alt="">'}<div><div class="t">${esc(b.name)}</div>
    <div class="s">${b.status === 'reading' ? '<span class="tag">Reading…</span>' : b.status === 'ok' ? `<span class="tag ok">Read</span> ${b.data.units_kwh ? inr(b.data.units_kwh) + ' units' : ''} ${b.data.billing_month ? '· ' + esc(b.data.billing_month) : ''} ${b.data.bill_amount_inr ? '· ' + R(b.data.bill_amount_inr) : ''}` : b.status === 'err' ? `<span class="tag err">${esc(b.err)}</span>` : 'Waiting'}</div>
    <div class="row" style="margin-top:6px">${sample && b.blob ? `<button class="btn ghost" data-act="rebill" data-i="${i}" style="min-height:34px;padding:0 10px;font-size:13px">Read again</button>` : ''}<button class="btn ghost" data-act="delbill" data-i="${i}" style="min-height:34px;padding:0 10px;font-size:13px">Remove</button></div></div></div>`).join('');
  return `<h1>Power bills</h1><p class="lead">Upload the last 3–12 months of electricity bills (PDF or photo). Claude reads units, bill amount, contract demand and category.</p>
  <label class="drop" id="billDrop"><input type="file" id="billIn" accept="image/*,application/pdf" multiple hidden><b>Drop bills here or tap to upload</b><br>PDF, JPG or PNG · first page of each PDF is read</label>
  ${sample ? '' : '<div class="note">Bill reading needs Claude access on this page. You can still type the figures below.</div>'}
  <div class="files">${list}</div>
  <h2>Consumption used in the proposal</h2>
  <div class="grid">${field('Average monthly consumption (units)','monthlyUnits','number')}${field('Average tariff incl. charges (₹/unit)','asm.tariff','number','step="0.01"')}</div>
  <div class="hint">Average tariff = bill amount ÷ units. Check it against the bill before sending the proposal.</div>`;
}
function stepSite() {
  const ml = mapLink(S.site.loc);
  const rows = S.site.plots.map((p, i) => `<tr><td style="width:74px">${p.url ? `<img src="${p.url}" alt="" style="width:66px;height:46px;object-fit:cover;border-radius:6px">` : ''}</td>
    <td><input data-plot="${i}" data-k="name" value="${esc(p.name)}" style="min-width:110px"></td>
    <td><select data-plot="${i}" data-k="type" style="min-width:110px"><option value="ground"${p.type==='ground'?' selected':''}>Ground</option><option value="rooftop"${p.type==='rooftop'?' selected':''}>Rooftop</option></select></td>

    ${h2('Plant configuration')}${T(th(['Block','Purpose','DC']) + blocks.map(b=>tr([b[0], b[2], inr(b[1])+' kWp'])).join('') + tr(['<b>Total solar</b>','', '<b>'+inr(C.solarKwp)+' kWp</b>']) + (s.bess ? tr(['Battery energy storage','LFP, with PCS & EMS', s.bess+' MWh']) : ''))}
    ${h2('Commercial offer')}${T(th(['Description','Amount']) + tr([`Solar PV plant — ${inr(C.solarKwp)} kWp (≈${R(C.perKwp)} per kWp)`, R(C.plant)]) + tr(['Approvals, CEIG & DISCOM liaison', R(s.approvals)]) + tr(['GST on solar — 5% on 70% + 18% on 30%', R(C.g5+C.g18)]) + (s.bess ? tr([`Battery energy storage — ${s.bess} MWh`, R(C.bB)]) + tr(['GST on BESS @ 18%', R(C.bG)]) : '') + (C.go ? tr(['GO / allotment charges — no GST', R(C.go)]) : '') + tr(['<b>Total project cost (incl. GST)</b>', '<b>'+R(C.total)+'</b>'], 'border-top:1.5px solid #1c1c1c;font-size:12.5px;'))}`)}

function summaryText(C) {
  const c = S.client, s = S.sys;
  return `Proposal ${c.quote} — ${c.name}\nSolar ${inr(C.solarKwp)} kWp (NM ${inr(s.nm)}, behind the meter ${inr(s.btm)}, grid sale ${inr(C.oa)})${s.bess ? ' + ' + s.bess + ' MWh BESS' : ''}\nTotal incl. GST: ${R(C.total)}\nConsumption met (yr 1): ${C.offPct.toFixed(0)}%\nBenefit yr 1: ${R(C.yrs[0].b)} · Payback ${C.pb ? C.pb.toFixed(1) + ' yrs' : '>25 yrs'} · 25-yr benefit ${R(C.cum[24])}`;

function render() {
  const C = calc();
  $('#steps').innerHTML = STEPS.map((t,i)=>`<button class="${i===S.step?'on':''} ${i<S.step?'done':''}" data-step="${i}"><span class="n">${i+1}</span><span class="x">${t}</span></button>`).join('');
  const body = [stepClient, stepBills, stepSite, stepSystem, stepProposal][S.step](C);
  const ae = document.activeElement, keep = ae && (ae.dataset.p || ae.dataset.plot !== undefined || ae.dataset.pay !== undefined) ? {p: ae.dataset.p, plot: ae.dataset.plot, k: ae.dataset.k, pay: ae.dataset.pay, pos: ae.selectionStart} : null;
  $('#main').innerHTML = `<div class="panel">${body}<div class="nav">${S.step ? '<button class="btn ghost" data-step="' + (S.step-1) + '">Back</button>' : '<span></span>'}${S.step < 4 ? '<button class="btn" data-step="' + (S.step+1) + '">Continue</button>' : ''}</div></div>`;
  $('#quote').innerHTML = quoteCard(C);
  if (keep) { const sel = keep.p ? `[data-p="${keep.p}"]` : keep.pay !== undefined ? `[data-pay="${keep.pay}"]` : `[data-plot="${keep.plot}"][data-k="${keep.k}"]`; const el = $(sel); if (el) { el.focus(); try { if (keep.pos != null) el.setSelectionRange(keep.pos, keep.pos); } catch (e) {} } }
  bindDrops();
}

function setPath(path, v) { const ks = path.split('.'); let o = S; ks.slice(0,-1).forEach(k=>o=o[k]); const old = o[ks.at(-1)]; o[ks.at(-1)] = typeof old === 'number' ? num(v) : v; }
let t;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.p) setPath(el.dataset.p, el.value);
  else if (el.dataset.plot !== undefined) { const p = S.site.plots[+el.dataset.plot]; p[el.dataset.k] = el.value; if (['area','unit','type'].includes(el.dataset.k)) { p.label = null; p.kwp = suggestKwp(p); } }
  else if (el.dataset.pay !== undefined) S.pay[+el.dataset.pay] = num(el.value);
  else return;
  save(); clearTimeout(t); t = setTimeout(render, el.tagName === 'SELECT' ? 0 : 450);
});
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT') { clearTimeout(t); render(); } });

async function addFiles(files, kind) {
  for (const f of files) {
    const item = kind === 'bill' ? {name: f.name, status: 'new'} : {name: f.name.replace(/\.[^.]+$/, '').slice(0, 30) || 'Plot', type: 'ground', area: '', unit: 'acres', kwp: 0, status: 'new'};
    try { const im = await toImage(f); item.blob = im.blob; if (kind === 'bill') item.thumb = im.url; else item.url = im.url; } catch (e) { item.status = 'err'; item.err = 'Could not open this file'; }
    if (kind === 'bill') { S.bills.push(item); if (sample && item.blob) readBill(item); }
    else { S.site.plots.push(item); if (sample && item.blob) readSite(item); }
  }
  save(); render();
}
function bindDrops() {
  [['#billDrop','#billIn','bill'],['#siteDrop','#siteIn','site']].forEach(([d,i,k]) => {
    const dz = $(d), inp = $(i); if (!dz) return;
    inp.onchange = () => { addFiles([...inp.files], k); };
    dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave = () => dz.classList.remove('over');
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove('over'); addFiles([...e.dataTransfer.files], k); };
  });
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.step !== undefined) { S.step = +b.dataset.step; save(); render(); window.scrollTo({top:0}); return; }
  if (b.dataset.mode) { S.sys.mode = b.dataset.mode; save(); render(); return; }
  if (b.id === 'reset') { if (b.dataset.sure) { S = blank(); save(); render(); } else { b.dataset.sure = 1; b.textContent = 'Tap again to clear'; setTimeout(()=>{ b.textContent = 'New proposal'; delete b.dataset.sure; }, 3000); } return; }
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'delbill') { S.bills.splice(i,1); summariseBills(); }
  if (a === 'rebill') readBill(S.bills[i]);
  if (a === 'delplot') S.site.plots.splice(i,1);
  if (a === 'addplot') S.site.plots.push({name:'Plot ' + (S.site.plots.length+1), type:'ground', area:'', unit:'acres', kwp:0});
  if (a === 'suggest') {
    const daily = (S.monthlyUnits||0)/30.4, perKwp = S.asm.yield/365, need = daily*S.asm.day/100 + S.sys.bess*900;
    S.sys.btm = Math.max(0, Math.round((need/perKwp - S.sys.nm)/10)*10);
  }
  if (a === 'copy') { try { await navigator.clipboard.writeText(summaryText(calc())); $('#msg').textContent = 'Summary copied.'; } catch (err) { $('#msg').textContent = 'Copy was blocked by the browser.'; } return; }
  if (a === 'download') {
    const C = calc(), html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(S.client.quote)} — ${esc(S.client.name)}</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>@page{size:A4;margin:0}body{margin:0;background:#e9e9e6}main{max-width:794px;margin:0 auto;background:#fff}@media print{body{background:#fff}}</style></head><body><main>${docBody(C)}</main></body></html>`;
    try { await downloads.save({filename: `Proposal_${S.client.quote.replace(/[^\w-]+/g,'_')}.html`, data: html}); $('#msg').textContent = 'Saved. Open it and print to PDF.'; } catch (err) { $('#msg').textContent = 'Download was not completed.'; }
    return;
  }
  save(); render();
});

render();
}
</script>
</body>
</html>
